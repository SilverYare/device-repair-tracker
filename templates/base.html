{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Ремонт устройств{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'homepage:index' %}">Ремонт устройств</a>
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="{% url 'devices:list' %}">Устройства</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'masters:list' %}">Мастера</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'repairs:list' %}">Заявки</a></li>
            </ul>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
